<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WarZTH - Update Notes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0a0a;
      color: #c8c8c8;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #header {
      background: linear-gradient(180deg, #1a1a1a 0%, #111 100%);
      border-bottom: 1px solid #333;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    #header h1 {
      color: #e8a020;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      line-height: 1.9;
    }

    #content::-webkit-scrollbar {
      width: 6px;
    }

    #content::-webkit-scrollbar-track {
      background: #111;
    }

    #content::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }

    #content::-webkit-scrollbar-thumb:hover {
      background: #666;
    }

    .section-title {
      color: #e8a020;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 6px;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    .item {
      padding: 2px 0 2px 12px;
      border-left: 2px solid #2a2a2a;
      color: #b8b8b8;
      transition: border-color 0.15s;
    }

    .item:hover {
      border-left-color: #e8a020;
      color: #e0e0e0;
    }

    #footer {
      background: linear-gradient(0deg, #1a1a1a 0%, #111 100%);
      border-top: 1px solid #333;
      padding: 10px 16px;
      display: flex;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    #closebrowser {
      display: inline-block;
      background: linear-gradient(180deg, #c0392b 0%, #922b21 100%);
      color: #fff;
      border: 1px solid #e74c3c;
      padding: 7px 22px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 3px;
      letter-spacing: 0.5px;
      text-decoration: none;
      transition: background 0.15s, box-shadow 0.15s;
    }

    #closebrowser:hover {
      background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%);
      box-shadow: 0 0 8px rgba(231, 76, 60, 0.5);
    }

    #closebrowser:active {
      background: linear-gradient(180deg, #922b21 0%, #7b241c 100%);
    }

    #error {
      color: #e74c3c;
      padding: 20px;
      display: none;
    }
  </style>
</head>
<body>

  <div id="header">
    <h1>WarZTH — Update Notes</h1>
  </div>

  <div id="content">
    <div id="lines"><span style="color:#555">กำลังโหลด...</span></div>
    <div id="error">ไม่พบไฟล์ update.txt</div>
  </div>

  <div id="footer">
    <a id="closebrowser" href="closebrowser://close">ปิดหน้าต่าง</a>
  </div>

  <script>
    fetch('update.txt')
      .then(function(res) {
        if (!res.ok) throw new Error('not found');
        return res.text();
      })
      .then(function(text) {
        var lines = text.split('\n');
        var html = '';
        lines.forEach(function(line) {
          line = line.trim();
          if (!line) return;
          if (line.startsWith('//')) {
            html += '<div class="section-title">' + escapeHtml(line) + '</div>';
          } else {
            html += '<div class="item">' + escapeHtml(line) + '</div>';
          }
        });
        document.getElementById('lines').innerHTML = html;
      })
      .catch(function() {
        document.getElementById('lines').style.display = 'none';
        document.getElementById('error').style.display = 'block';
      });

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
  </script>

</body>
</html>
